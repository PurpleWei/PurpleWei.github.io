timezone: Asia/Shanghai

# ==================== 社交链接 ====================
# al-folio 的社交图标配置在 _data/socials.yml 中，
# 模板自带的很多链接（twitter/orcid 等）用不到，请打开该文件，
# 把不需要的整段删掉，只保留 email 一项即可（或按格式添加）。

# ==================== 导航栏 ====================
navbar_fixed: true
nav_order: 1

# ==================== 首页各模块开关 ====================
announcements:
  enabled: true
  scrollable: true
  limit: 5
news:
  enabled: true
  scrollable: true
  limit: 5
latest_posts:
  enabled: false
  limit: 3
selected_papers:
  enabled: false
social: true                      # 页面底部显示邮箱等联系图标

# ==================== 外观 ====================
theme: light                      # 亮色主题（喜欢深色可改成 dark）
code_theme: default
max_width: 930px
use_fontawesome: true

# ==================== 数学公式 / 图表（先保持默认即可） ====================
enable_math: true
enable_progressbar: true
enable_video_embedding: false

# ==================== 图标与验证（保持默认） ====================
favicon: favicon.ico
og_image: assets/img/prof_pic.jpg
